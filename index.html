<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141a2e">
  <meta name="description" content="Asterwake: a cosy idle tower defense where the whole village is the tower.">
  <title>Asterwake</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%23141a2e'/%3E%3Ccircle cx='12' cy='12' r='3.2' fill='%237fd6c8'/%3E%3Cellipse cx='12' cy='12' rx='9' ry='3.6' fill='none' stroke='%237fd6c8' stroke-width='1.5' transform='rotate(-25 12 12)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <a class="skip" href="#nav">Skip to game menu</a>
  <div id="app">
    <main id="stage" aria-label="Village view. Drag to move the camera; select a building or spawn point to inspect it.">
      <canvas id="scene" tabindex="-1"></canvas>
    </main>
    <header id="topbar"></header>
    <nav id="nav" aria-label="Game views"></nav>
    <aside id="panel" hidden aria-live="off"></aside>
    <div id="guide" hidden aria-live="polite"></div>
    <div id="bottom">
      <div id="queue" hidden aria-label="Upgrades in progress"></div>
      <section id="night-card" aria-label="Tonight" aria-live="off"></section>
    </div>
    <div id="cam-wrap">
      <button id="cam-toggle" class="cam-btn" type="button" aria-expanded="false" aria-controls="cam" aria-label="Camera controls">⌖</button>
      <div id="cam"></div>
    </div>
    <div id="toasts" aria-live="polite"></div>
    <div id="banner" hidden role="alert"></div>
    <button id="show-ui" type="button">Show interface</button>
    <div id="tooltip" hidden></div>
    <div id="modal-root"></div>
    <noscript><p class="fatal">Asterwake needs JavaScript to run.</p></noscript>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
